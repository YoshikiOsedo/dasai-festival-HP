<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大学祭宣伝</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #14354d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { min-height: 100vh; min-height: 100svh; max-width: 780px; margin: auto; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
    .logo { display: block; width: min(320px, 100%); height: auto; }
    .socials { width: 100%; }
    h1 { margin: 0 0 20px; font-size: 1.5rem; text-align: center; }
    .social-links { display: grid; gap: 14px; }
    .social-link { display: grid; gap: 8px; padding: 20px 24px; border: 1px solid #cbdbe7; border-radius: 12px; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
    .social-link:hover { background: #f0f6fa; border-color: #07558e; }
    .social-link:focus-visible { outline: 3px solid #07558e; outline-offset: 4px; }
    .platform { color: #07558e; font-size: 1.15rem; font-weight: 700; }
    .account { font-size: .9rem; line-height: 1.7; }
    .link-label { color: #064e83; font-weight: 600; line-height: 1.6; text-decoration: underline; text-underline-offset: 4px; }
    @media (max-width: 480px) { main { padding: 32px 20px; gap: 28px; } .logo { width: min(240px, 100%); } .social-link { padding: 18px; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./assets/logo.png" alt="デーサイ企画部ロゴ — IDS CHIBA UNIV." width="1024" height="1024">
    <section class="socials" aria-labelledby="social-heading">
      <h1 id="social-heading">SNSリンク</h1>
      <div class="social-links">
        <a class="social-link" href="https://x.com/chibaudsfes2025">
          <span class="platform">X</span>
          <span class="account">千葉大学情報・データサイエンス学部2026大学祭広報課</span>
          <span class="link-label">デー祭公式Xはこちら <span aria-hidden="true">↗</span></span>
        </a>
        <a class="social-link" href="https://www.instagram.com/datascience.daisaikikaku/">
          <span class="platform">Instagram</span>
          <span class="account">千葉大学情報・データサイエンス学部/大祭企画</span>
          <span class="link-label">デー祭公式Instagramはこちら <span aria-hidden="true">↗</span></span>
        </a>
        <a class="social-link" href="https://www.youtube.com/@%E5%8D%83%E8%91%89%E5%A4%A7%E5%AD%A6%E6%83%85%E5%A0%B1DS%E5%AD%A6%E9%83%A8">
          <span class="platform">YouTube</span>
          <span class="account">千葉大学情報・データサイエンス学部</span>
          <span class="link-label">情報・データサイエンス学部公式チャンネルはこちら <span aria-hidden="true">↗</span></span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
